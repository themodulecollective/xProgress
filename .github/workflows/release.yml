name: Tag and Release on Version Bump
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  tag-and-release:
    name: Tag and create a GitHub Release when ModuleVersion changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $Manifest = Import-PowerShellDataFile -Path ./xProgress.psd1
          $Tag = "v$($Manifest.ModuleVersion)"
          $exists = git tag -l $Tag
          $isNew = if ($exists) { 'false' } else { 'true' }
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "isNew=$isNew" >> $env:GITHUB_OUTPUT
          Write-Output "Manifest version: $($Manifest.ModuleVersion); tag: $Tag; isNew: $isNew"
      - name: Install Pester and PSScriptAnalyzer
        if: steps.version.outputs.isNew == 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -ErrorAction Stop
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -ErrorAction Stop
      - name: Run test suite (includes PSScriptAnalyzer via ScriptAnalyzer.Tests.ps1)
        if: steps.version.outputs.isNew == 'true'
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force
          $result = Invoke-Pester -Path ./Tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              Write-Error "$($result.FailedCount) Pester test(s) failed - not tagging or releasing." -ErrorAction Stop
          }
      - name: Create tag
        if: steps.version.outputs.isNew == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create GitHub Release
        if: steps.version.outputs.isNew == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Manifest = Import-PowerShellDataFile -Path ./xProgress.psd1
          gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes "$($Manifest.PrivateData.PSData.ReleaseNotes)"
      - name: Trigger Gallery publish
        # A release created with the default GITHUB_TOKEN does not fire other workflows'
        # `release: created` trigger (GitHub's anti-recursion safeguard), so publish.yml is
        # invoked explicitly here instead - workflow_dispatch is exempt from that restriction.
        if: steps.version.outputs.isNew == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref main
